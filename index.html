<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<meta name="theme-color" content="#ffffff">
<title>RAMP — 3.4 LISTEN Visual Prompt</title>
<style>
:root{
  --ink:#102033; --muted:#66727f;
  --green:#3f8f2f; --green-dark:#1f5f1b; --green-bg:#e3f4d7;
  --purple:#7a47ae; --purple-dark:#4f2281; --purple-bg:#eadcf8;
  --blue:#244e7b; --line:#dfe5ea; --shadow:0 10px 28px rgba(25,35,50,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{max-width:980px;margin:auto;padding:18px 14px 48px}

/* Opening */
.hero{text-align:center;padding:18px 8px 8px}
.mosaic{
  width:180px;height:180px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(#dbc9ef,#bfe5f3,#dff1b0,#ffe3a2,#f3c8e6,#dbc9ef);
  box-shadow:0 10px 28px rgba(0,0,0,.08)
}
.mosaic:before{content:"";position:absolute;inset:12px;border-radius:50%;background:rgba(255,255,255,.74)}
.people{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:54px;line-height:1}
.hero h1{margin:0;font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;font-weight:900;letter-spacing:-.03em}
.hero p{margin:16px 0 0;color:#59636f;font-size:clamp(1rem,2.2vw,1.28rem)}
.choiceRow{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:860px;margin:14px auto 0}
.choice{border:0;border-radius:22px;min-height:148px;padding:24px;color:#fff;font-weight:850;font-size:clamp(1.1rem,3vw,1.8rem);line-height:1.25;box-shadow:var(--shadow)}
.know{background:linear-gradient(145deg,#4d9a39,#3f872f)}
.learn{background:linear-gradient(145deg,#7d4ab7,#673a9f)}
.enterWrap{text-align:center;margin-top:22px}
.enterBtn{border:0;border-radius:15px;background:var(--blue);color:#fff;padding:13px 32px;font-weight:900;box-shadow:var(--shadow)}
.enterBtn:disabled{opacity:.28}
.hint{text-align:center;color:var(--muted);font-size:.88rem;margin-top:10px}

/* Dialog */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;padding:18px;z-index:50}
.dialog{width:min(92vw,560px);background:#fff;border-radius:24px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.24)}
.dialog h2{margin:0 0 8px}.dialog p{margin:0 0 16px;color:var(--muted)}
.input{width:100%;padding:15px 16px;border:2px solid #cbd4dd;border-radius:14px;outline:none;font-size:1.08rem}
.input:focus{border-color:var(--blue)}
.dialogActions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.smallBtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px}
.saveBtn{background:var(--blue);color:#fff;font-weight:800}

/* Result */
.result{margin-top:26px;border-top:1px solid var(--line);padding-top:24px}
.subjectBar{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:14px}
.subjectPill{min-width:0;border-radius:28px;padding:14px 18px;font-size:1.45rem;font-weight:900;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.leftPill{background:linear-gradient(90deg,#bfe7a9,#f5fbf1);color:var(--green-dark)}
.rightPill{background:linear-gradient(90deg,#faf7fd,#d1afea);color:var(--purple-dark)}
.link{text-align:center;font-size:1.35rem}
.tagline{text-align:center;font-weight:850;font-size:1.15rem;margin:8px 0 6px}
.status{text-align:center;color:var(--muted);font-size:.82rem;margin:0 0 16px}

/* Shared stripped comparison surface */
.sharedSurface{
  position:relative;border-radius:26px;overflow:hidden;border:1px solid #dbe2e8;
  box-shadow:0 10px 28px rgba(20,30,45,.07);
  background:linear-gradient(90deg,var(--green-bg) 0%,var(--green-bg) 49.5%,#fff 49.5%,#fff 50.5%,var(--purple-bg) 50.5%,var(--purple-bg) 100%);
  padding:20px 18px 24px;
}
.sharedHead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-bottom:18px}
.sharedHead div{text-align:center;font-size:1.3rem;font-weight:950;padding:4px}
.sharedHead .left{color:var(--green-dark)} .sharedHead .right{color:var(--purple-dark)}
.rowPair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;margin-bottom:18px}
.sideGroup{min-width:0;display:grid;gap:12px}
.sideGroup.one{grid-template-columns:minmax(0,1fr)}
.sideGroup.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.concept{min-width:0;text-align:center;padding:10px 6px}
.concept.root{min-height:132px}.concept.regular{min-height:146px}
.concept .ico{font-size:1.65rem}
.concept b{display:block;margin:5px 0 5px;font-size:.96rem;line-height:1.15}
.leftGroup .concept b{color:var(--green-dark)} .rightGroup .concept b{color:var(--purple-dark)}
.concept span{display:block;color:#5f6b77;font-size:.81rem;line-height:1.3;max-width:19ch;margin:0 auto}
.treeBridge{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;height:26px;margin:-4px 0 2px}
.treeBridge .left,.treeBridge .right{position:relative}
.treeBridge .left:before,.treeBridge .right:before{content:"";position:absolute;left:50%;top:0;height:26px;border-left:3px solid}
.treeBridge .left:before{border-color:#65a54c}.treeBridge .right:before{border-color:#8b57b8}

/* Knowledge connections */
.connections{margin-top:22px;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.connTitle{text-align:center;font-weight:950;padding:13px;background:#fafbfc}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr);border-top:1px solid var(--line);align-items:stretch}
.ccell{min-width:0;padding:11px 12px;display:flex;gap:9px;align-items:flex-start}
.leftc{background:#f7fcf4}.rightc{background:#fcf8fe}
.cicon{font-size:1.2rem}.ctxt b{display:block;margin-bottom:2px}.ctxt span{font-size:.80rem;color:#626d78;line-height:1.3}
.eq{display:grid;place-items:center;font-weight:950;background:#fff}
.more{text-align:center;margin-top:18px}
.more button{border:2px solid var(--purple);background:#fff;color:var(--purple-dark);font-weight:900;border-radius:15px;padding:11px 20px}

@media(max-width:720px){
  .mosaic{width:145px;height:145px}.people{font-size:43px}
  .choiceRow{grid-template-columns:1fr;gap:14px}.choice{min-height:116px}
  .subjectBar{grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr);gap:7px;position:sticky;top:0;z-index:10;background:#fff;padding:8px 0}
  .subjectPill{padding:10px 6px;font-size:1rem}
  .sharedSurface{padding:16px 10px 20px}
  .sharedHead{gap:10px}.sharedHead div{font-size:.95rem}
  .rowPair{gap:10px;margin-bottom:14px}.sideGroup{gap:6px}.concept{padding:8px 2px}
  .concept.root{min-height:128px}.concept.regular{min-height:156px}
  .concept .ico{font-size:1.22rem}.concept b{font-size:.77rem}.concept span{font-size:.67rem;line-height:1.22;max-width:14ch}
  .treeBridge{gap:10px}
  .crow{grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr)}
  .ccell{padding:8px 6px;gap:5px}.cicon{font-size:1rem}.ctxt b{font-size:.76rem}.ctxt span{font-size:.66rem}
}

/* 1.6 containment + native pinch zoom */
.sharedSurface, .connections, .crow, .ccell, .concept, .sideGroup, .rowPair {
  min-width:0;
}
.sideGroup, .concept, .ctxt {
  overflow:hidden;
}
.concept b, .concept span, .ctxt b, .ctxt span {
  overflow-wrap:anywhere;
  word-break:break-word;
  white-space:normal;
}
.concept b {
  max-width:100%;
}
.concept span {
  max-width:100%;
}
.rowPair {
  align-items:stretch;
}
.concept.regular, .concept.root {
  min-height:0;
  height:auto;
}
.crow {
  align-items:stretch;
}
.ccell {
  overflow:hidden;
}
.ctxt {
  min-width:0;
}
@media(max-width:720px){
  .sharedSurface{overflow:hidden}
  .rowPair{align-items:stretch}
  .sideGroup.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .concept{min-height:0!important;height:auto}
  .concept b{font-size:.74rem;line-height:1.12}
  .concept span{font-size:.65rem;line-height:1.18}
  .ctxt b{font-size:.73rem;line-height:1.14}
  .ctxt span{font-size:.64rem;line-height:1.18}
}

</style>

<style id="ramp-clean-opening">
/* Legacy Knowledge Family Tree branding: completely retired. */
.logo, .family, .family-logo, .familyIcon, .family-icon,
.hero-title, .hero-subtitle, .intro-title, .intro-subtitle { display:none !important; }

/* Keep the opening tight: RAMP artwork then controls. */
#rampHero { margin-bottom: 14px !important; }
</style>

<style id="legacy-header-kill">
.mosaic,.people,.family,.family-logo,.familyIcon,.family-icon,
.hero h1,.hero .mosaic,.hero .people {display:none!important;}
.hero:empty{display:none!important;margin:0!important;padding:0!important;height:0!important;}
</style>

<script>
(()=> {
const $=id=>document.getElementById(id);
let known="", learn="", editing=null;

/* Curated source packs: all are normal public web knowledge sources.
   The UI does not expose links; these are used only to build the compact tree. */
const SOURCE_PACKS=[
  {name:"Wikipedia",host:"https://en.wikipedia.org/w/api.php",kind:"article",weight:5},
  {name:"Wikibooks",host:"https://en.wikibooks.org/w/api.php",kind:"learning",weight:4},
  {name:"Wikiversity",host:"https://en.wikiversity.org/w/api.php",kind:"learning",weight:4},
  {name:"Wiktionary",host:"https://en.wiktionary.org/w/api.php",kind:"terms",weight:3}
];
const WIKIDATA={name:"Wikidata",host:"https://www.wikidata.org/w/api.php",kind:"entity",weight:4};

const RELATIONSHIP_ROLES=[
  {key:"whole", icon:"🧩", label:"Whole subject", hints:["overview","basics","fundamentals","introduction"]},
  {key:"tool", icon:"🛠️", label:"Tool / equipment", hints:["equipment","tools","gear","instrument"]},
  {key:"action", icon:"⚙️", label:"Action / technique", hints:["technique","method","skill","how to","mechanics"]},
  {key:"aim", icon:"🎯", label:"Aim / objective", hints:["goal","objective","target","scoring","purpose"]},
  {key:"strategy", icon:"🧭", label:"Strategy / planning", hints:["strategy","planning","tactics","decision making"]},
  {key:"rules", icon:"📏", label:"Rules / constraints", hints:["rules","regulations","standards","constraints"]},
  {key:"practice", icon:"🔁", label:"Practice / improvement", hints:["practice","training","improvement","learning"]}
];


function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function words(s){return String(s).toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(x=>x.length>2)}
function intentQuery(subject){
  const x=subject.trim().toLowerCase();
  const map=[
    [/^coding$|^code$|^programming$|computer programming|software development/,"computer programming software development coding"],
    [/^football$|^soccer$/,"association football soccer sport"],
    [/american football|nfl/,"American football sport"],
    [/cars?$|automotive/,"automobile automotive vehicles"],
    [/bible|scripture/,"Bible scripture Christianity"],
    [/golf/,"golf sport"]
  ];
  for(const [re,q] of map) if(re.test(x)) return q;
  return subject;
}
function intendedDomainWords(subject){
  return words(intentQuery(subject));
}

function iconFor(text){
  const t=text.toLowerCase();
  const rules=[
    [/bible|scripture|book|literature|writing|word/,"📖"],[/golf|sport|game/,"⛳"],
    [/code|program|software|computer|technology|digital/,"💻"],[/car|vehicle|automotive|engine|transport/,"🚗"],
    [/house|building|construction|architecture|roof/,"🏠"],[/music|song|sound|audio/,"🎵"],
    [/food|cook|cuisine|recipe/,"🍳"],[/plant|garden|botany|tree|agriculture/,"🌿"],
    [/physics|astronomy|space|planet|star/,"🔭"],[/science|chemistry|laboratory/,"🧪"],
    [/history|ancient|war|empire|civilization/,"🏛️"],[/health|medicine|biology|anatomy/,"🧬"],
    [/business|finance|econom|market|industry/,"💼"],[/art|paint|design|photograph/,"🎨"],
    [/law|legal|rule|regulation/,"⚖️"],[/education|learning|school|study/,"🎓"],
    [/tool|method|process|technique/,"🛠️"],[/person|people|human|role/,"👤"],
    [/place|geography|country|city|world/,"🌍"],[/goal|purpose|objective/,"🎯"],
    [/system|structure|network|connection/,"🔗"]
  ];
  for(const [re,icon] of rules) if(re.test(t)) return icon;
  return "🧩";
}
function cleanText(s){
  const raw=String(s||"");
  const box=document.createElement("div");
  box.innerHTML=raw;
  return (box.textContent||box.innerText||"")
    .replace(/\[[^\]]+\]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function shortDef(s){
  const x=cleanText(s);
  if(!x)return "A foundational concept related to this subject.";
  const sentences=x.split(/(?<=[.!?])\s+/).filter(Boolean);
  let out=(sentences.slice(0,1).join(" ") || x).slice(0,125);
  if(out.length===125) out=out.replace(/\s+\S*$/,"")+".";
  return out;
}
function generic(subject){
  return [
    [iconFor(subject),subject,"The overall subject being explored."],
    ["🌿","Structure","How the major parts of the subject are organized."],
    ["🧠","Core Idea","A central idea people use to understand the subject."],
    ["⚙️","Process","How an important part of the subject works."],
    ["🧭","Strategy / Method","How choices, methods, or direction are organized."],
    ["🎯","Focus","A major point of attention within the subject."],
    ["🔁","Practice / Application","How the subject is used, practiced, or developed."]
  ];
}
async function searchWiki(pack,subject){
  const query=intentQuery(subject);
  const url=pack.host+"?action=query&list=search&srsearch="+encodeURIComponent(query)+
    "&srlimit=8&format=json&origin=*";
  const res=await fetch(url);
  if(!res.ok)throw new Error(pack.name+" search");
  const j=await res.json();
  return ((j.query&&j.query.search)||[]).map((x,i)=>({
    title:x.title, snippet:cleanText(x.snippet), pack:pack.name, weight:pack.weight, rank:i
  }));
}
async function fetchExtracts(pack,titles){
  if(!titles.length)return {};
  const url=pack.host+"?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&titles="+
    encodeURIComponent(titles.join("|"))+"&format=json&origin=*";
  const res=await fetch(url);
  if(!res.ok)return {};
  const j=await res.json();
  const pages=Object.values((j.query&&j.query.pages)||{});
  const map={};
  pages.forEach(p=>map[p.title]=p.extract||"");
  return map;
}
async function wikidataSearch(subject){
  const query=intentQuery(subject);
  const url=WIKIDATA.host+"?action=wbsearchentities&search="+encodeURIComponent(query)+
    "&language=en&uselang=en&type=item&limit=8&format=json&origin=*";
  const res=await fetch(url);
  if(!res.ok)throw new Error("Wikidata search");
  const j=await res.json();
  return (j.search||[]).map((x,i)=>({
    title:x.label||x.display?.label?.value||subject,
    snippet:x.description||x.display?.description?.value||"",
    pack:"Wikidata",weight:WIKIDATA.weight,rank:i
  }));
}
function scoreCandidate(c,subject){
  const sw=words(subject);
  const domain=intendedDomainWords(subject);
  const tw=words(c.title+" "+c.snippet);
  const overlap=sw.filter(w=>tw.includes(w)).length;
  const domainOverlap=domain.filter(w=>tw.includes(w)).length;
  const exact=c.title.toLowerCase()===subject.toLowerCase()?8:0;
  let penalty=0;
  const text=(c.title+" "+c.snippet).toLowerCase();
  if(/disambiguation|list of|outline of|index of/.test(text)) penalty-=7;

  const x=subject.trim().toLowerCase();
  if((x==="coding"||x==="code"||x==="programming") &&
     /prison|inmate|carceral|medical coding|compression|huffman|predictive coding|coding theory/.test(text)) penalty-=12;

  if((x==="football"||x==="soccer") &&
     /american football|gridiron|australian rules|rugby/.test(text)) penalty-=8;

  return c.weight*2 + overlap*3 + domainOverlap*2.5 + exact - c.rank*.35 + penalty;
}
function uniqueCandidates(items){
  const seen=new Set(),out=[];
  for(const x of items.sort((a,b)=>b.score-a.score)){
    const k=x.title.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
    if(!k||seen.has(k))continue;
    seen.add(k);out.push(x);
  }
  return out;
}
async function bestConceptForRole(subject,role){
  const queries=[];
  const base=intentQuery(subject);
  for(const hint of role.hints.slice(0,3)){
    queries.push(base+" "+hint);
  }

  let candidates=[];
  for(const pack of SOURCE_PACKS.slice(0,3)){
    for(const q of queries){
      try{
        const url=pack.host+"?action=query&list=search&srsearch="+encodeURIComponent(q)+
          "&srlimit=5&format=json&origin=*";
        const res=await fetch(url);
        if(!res.ok)continue;
        const j=await res.json();
        const rows=(j.query&&j.query.search)||[];
        rows.forEach((x,i)=>candidates.push({
          title:x.title,
          snippet:cleanText(x.snippet),
          pack:pack.name,
          host:pack.host,
          rank:i
        }));
      }catch(e){}
    }
  }

  const bad=/disambiguation|list of|index of|journal|magazine|television|video game|film|novel|album|tournament|championship|club/i;
  const subjectWords=words(subject);
  const hintWords=words(role.hints.join(" "));

  candidates=candidates.map(c=>{
    const txt=(c.title+" "+c.snippet).toLowerCase();
    const tw=words(txt);
    const subjOverlap=subjectWords.filter(w=>tw.includes(w)).length;
    const roleOverlap=hintWords.filter(w=>tw.includes(w)).length;
    let score=subjOverlap*4+roleOverlap*3-c.rank*.3;
    if(bad.test(txt))score-=8;
    return {...c,score};
  }).sort((a,b)=>b.score-a.score);

  const chosen=candidates.find(c=>c.score>1);
  if(!chosen){
    return [role.icon, role.label, "A core "+role.label.toLowerCase()+" concept within "+subject+"."];
  }

  // Fetch a clean intro extract for the chosen concept.
  let extract="";
  try{
    const url=chosen.host+"?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&titles="+
      encodeURIComponent(chosen.title)+"&format=json&origin=*";
    const res=await fetch(url);
    const j=await res.json();
    const pages=Object.values((j.query&&j.query.pages)||{});
    extract=pages[0]&&pages[0].extract||"";
  }catch(e){}

  const def=shortDef(extract||chosen.snippet);
  return [role.icon, chosen.title, def];
}

async function relationshipSubject(subject){
  const nodes=[];
  for(const role of RELATIONSHIP_ROLES){
    if(role.key==="whole"){
      nodes.push([role.icon, subject, "The overall subject being explored."]);
    }else{
      nodes.push(await bestConceptForRole(subject,role));
    }
  }
  return nodes;
}
function concept(x,root=false){
  return '<div class="concept '+(root?'root':'regular')+'"><div class="ico">'+x[0]+'</div><b>'+esc(x[1])+'</b><span>'+esc(x[2])+'</span></div>';
}
function renderShared(L,R){
  const groups=[[0],[1,2],[3,4],[5,6]];
  let html="";
  groups.forEach((g,i)=>{
    html+='<div class="rowPair">'+
      '<div class="sideGroup '+(g.length===1?'one':'two')+' leftGroup">'+g.map(idx=>concept(L[idx],i===0)).join("")+'</div>'+
      '<div class="sideGroup '+(g.length===1?'one':'two')+' rightGroup">'+g.map(idx=>concept(R[idx],i===0)).join("")+'</div>'+
    '</div>';
    if(i<groups.length-1)html+='<div class="treeBridge"><div class="left"></div><div class="right"></div></div>';
  });
  $("sharedRows").innerHTML=html;
}
function pairs(L,R){return [[L[1],R[1]],[L[2],R[2]],[L[3],R[3]],[L[4],R[4]],[L[5],R[5]],[L[6],R[6]]]}
function renderConnections(L,R){
  $("connectionRows").innerHTML=pairs(L,R).map(p=>
    '<div class="crow">'+
      '<div class="ccell leftc"><div class="cicon">'+p[0][0]+'</div><div class="ctxt"><b>'+esc(p[0][1])+'</b><span>'+esc(p[0][2])+'</span></div></div>'+
      '<div class="eq">↔</div>'+
      '<div class="ccell rightc"><div class="cicon">'+p[1][0]+'</div><div class="ctxt"><b>'+esc(p[1][1])+'</b><span>'+esc(p[1][2])+'</span></div></div>'+
    '</div>'
  ).join("");
}

function buildChatGPTHandoffPrompt(){
  const familiar=known.trim();
  const learning=learn.trim();

  return [
    "Use this learning format for this conversation.",
    "",
    "I am familiar with "+familiar+" and want to learn "+learning+". Build the learning conversation around BOTH subjects. Treat what I know about "+familiar+" as a living knowledge area to refine and expand, not as certified mastery.",
    "",
    "PERSISTENT 50/50 PAIRED MODE: As long as we are discussing "+learning+", every teaching response must visibly contain BOTH "+familiar+" and "+learning+". For every new concept introduced from "+learning+", identify or restate a corresponding concept, structure, function, relationship, term, or principle from "+familiar+" in the SAME teaching unit. Present the two together, explain the correlation, and briefly show the important contrast. Do not gradually abandon "+familiar+" on your own after several steps. Keep the paired structure persistent until the learner explicitly changes the balance or asks to stop using it.",
    "",
    "50/50 means paired conceptual presence, not an exact mathematical word count. Each step should feel balanced enough that the familiar subject remains a visible reference point while the new subject continues to grow.",
    "",
    "If the learner explicitly asks to focus more heavily on one subject, follow that preference. After the first meaningful period under the changed balance, remind the learner ONCE that the original 50/50 mode is always available and can be restored with natural wording such as “go back to 50/50,” “compare both again,” or “bring "+familiar+" back in.” Do not repeatedly remind them.",
    "",
    "If the learner clearly changes to a completely unrelated topic, follow the new topic normally rather than forcing "+familiar+" and "+learning+" into an irrelevant comparison. Keep the 50/50 method available for this learning thread if the learner returns to it.",
    "",
    "FIRST RESPONSE PRIORITY: Immediately show direct correlations between "+familiar+" and "+learning+". Do not begin with a generic explanation of "+learning+" and add the comparison later. The first visible learning content should pair familiar ideas from "+familiar+" directly with corresponding ideas in "+learning+", preferably side by side or in another immediately readable visual structure.",
    "",
    "MORE COWBELL — VISUAL-FIRST MODE: Turn the visual presentation up substantially. Treat each teaching response as a colorful visual learning surface rather than a document. Use strong visual hierarchy, bold compact headings, meaningful emoji and symbols, clearly separated sections, card- or panel-like groupings, side-by-side comparisons, arrows, flows, timelines, mini maps, compact tables, simple diagrams, labeled sequences, and images when an image genuinely improves understanding and can be surfaced. Prefer visual relationships over long paragraphs. Make the response polished, lively, inviting, and easy to scan without becoming cluttered or childish. Do not output raw HTML source code merely to satisfy this instruction; use the richest rendered presentation the ChatGPT interface supports.",
    "",
    "Start small. Give only one manageable teaching step at a time, usually one or two strong paired connections. Use plain language beside the correct terminology. Avoid a syllabus, giant fact dump, long resource list, or search-results-style response.",
    "",
    "QUESTION HANDOFF AFTER EVERY LEARNING RESPONSE — VISUAL ATTENTION CUE: When each learning response is complete, STOP and end with the exact question: “Do you have any questions about this?” Treat this as the visual equivalent of an unmistakable “LISTEN!” cue: it must look clearly different from the teaching material around it. Use the strongest rendered emphasis the ChatGPT interface actually supports—prefer a standalone callout/card/banner treatment, a highly distinctive attention symbol such as 🔔 or ❗, bold oversized heading-style text, strong spacing above and below, and contrasting visual treatment when available. The learner should be able to glance at the screen and immediately locate the question without reading the preceding lesson. Do not rely on ordinary body-text color, do not bury it in a paragraph, and do not output raw HTML merely to force styling. If custom color is not available in the interface, create contrast through layout, heading hierarchy, symbols, borders/callouts, whitespace, and typography instead. Do not automatically continue into the next lesson until the learner answers or asks to continue.",
    "",
    "If the learner has no question and wants to continue, offer ONE specific next paired teaching step that grows directly from the correlation or contrast just presented. Name both sides of that proposed connection when practical. If the learner says yes, the next response must again visibly contain both subjects and must again end with the visually prominent question: “Do you have any questions about this?”",
    "",
    "Continue using this persistent paired visual teaching method from step to step unless the learner changes it. Let the learner's reactions, questions, understanding, and choices progressively personalize terminology, examples, depth, and presentation while preserving the two-subject relationship whenever it remains useful.",
    "",
    "When current or precise information materially improves accuracy, use ChatGPT Search and strong sources, but integrate that information into the learning surface instead of turning the response into a source dump.",
    "",
    "Begin the personalized paired visual learning conversation now."
  ].join("\\n");
}

async function handoffToChatGPT(){
  const prompt=buildChatGPTHandoffPrompt();

  let panel=document.getElementById("handoffPanel");
  if(!panel){
    panel=document.createElement("div");
    panel.id="handoffPanel";
    panel.style.cssText="margin:14px auto 0;max-width:680px;padding:16px;border-radius:18px;background:linear-gradient(145deg,#f7f1fc,#eef7ff);border:1px solid #d7c6e8;text-align:left;box-shadow:0 8px 22px rgba(20,30,45,.07)";
    document.querySelector(".more").appendChild(panel);
  }

  panel.innerHTML=
    '<div style="font-weight:950;font-size:1.08rem;color:#3f2463;text-align:center;margin-bottom:6px">Continue learning with ChatGPT</div>'+
    '<div style="font-size:.84rem;color:#66727f;text-align:center;margin-bottom:12px">Your two subjects have been turned into a personalized visual-learning instruction.</div>'+
    '<textarea id="handoffText" readonly style="width:100%;min-height:190px;max-height:260px;resize:vertical;border:1px solid #cfd7df;border-radius:13px;padding:12px;background:white;color:#253341;font:inherit;font-size:.78rem;line-height:1.35">'+esc(prompt)+'</textarea>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px">'+
      '<button id="copyPromptBtn" style="border:0;border-radius:13px;padding:12px;background:#6b3da1;color:white;font-weight:900">📋 COPY LEARNING PROMPT</button>'+
      '<button id="openGPTBtn" style="border:0;border-radius:13px;padding:12px;background:#244e7b;color:white;font-weight:900">↗ OPEN CHATGPT</button>'+
    '</div>'+
    '<div id="copyStatus" style="text-align:center;color:#52606d;font-size:.78rem;margin-top:9px">Copy the prompt, open ChatGPT, and paste it into a new conversation.</div>';

  document.getElementById("copyPromptBtn").onclick=async()=>{
    const text=document.getElementById("handoffText").value;
    try{
      await navigator.clipboard.writeText(text);
      document.getElementById("copyStatus").textContent="✓ Copied. Now open ChatGPT and paste it into a new conversation.";
    }catch(e){
      const ta=document.getElementById("handoffText");
      ta.focus(); ta.select();
      try{document.execCommand("copy")}catch(_){}
      document.getElementById("copyStatus").textContent="✓ Prompt selected/copied. Paste it into a new ChatGPT conversation.";
    }
  };

  document.getElementById("openGPTBtn").onclick=()=>window.open("https://chatgpt.com/","_blank","noopener");
  panel.scrollIntoView({behavior:"smooth",block:"center"});
}

function openDialog(side){
  editing=side;const k=side==="known";
  $("dialogTitle").textContent=k?"What do you think you know a lot about?":"What do you want to learn about?";
  $("dialogText").textContent=k?"Enter one subject you already feel familiar with.":"Enter one subject you want to understand.";
  $("subjectInput").value=k?known:learn;
  $("overlay").classList.remove("hidden");
  setTimeout(()=>{$("subjectInput").focus();$("subjectInput").select()},40);
}
function closeDialog(){$("overlay").classList.add("hidden");editing=null}
function saveSubject(){
  const v=$("subjectInput").value.trim(); if(!v)return;
  if(editing==="known")known=v; else learn=v;
  update();closeDialog();
}
function update(){
  $("knowBtn").textContent=known||"What do you think you know a lot about?";
  $("learnBtn").textContent=learn||"What do you want to learn about?";
  $("enterBtn").disabled=!(known&&learn);
}
async function render(){
  $("enterBtn").disabled=true;
  $("enterBtn").textContent="BUILDING…";
  $("status").textContent="Finding the clearest meaning for both subjects…";

  let L,R,leftFallback=false,rightFallback=false;
  try{L=await relationshipSubject(known)}catch(e){L=generic(known);leftFallback=true}
  try{R=await relationshipSubject(learn)}catch(e){R=generic(learn);rightFallback=true}
  $("leftPill").innerHTML=L[0][0]+" "+esc(known.toUpperCase());
  $("rightPill").innerHTML=R[0][0]+" "+esc(learn.toUpperCase());
  $("leftTitle").textContent=known.toUpperCase();
  $("rightTitle").textContent=learn.toUpperCase();

  renderShared(L,R);
  renderConnections(L,R);

  if(leftFallback||rightFallback){
    $("status").textContent="Connected knowledge was unavailable for "+(leftFallback&&rightFallback?"both subjects":leftFallback?known:learn)+", so a basic fallback was used.";
  }else{
    $("status").textContent="Built dynamically around matching roles so the left side helps explain the right.";
  }

  $("resultSurface").classList.remove("hidden");
  $("resultSurface").scrollIntoView({behavior:"smooth",block:"start"});
  $("enterBtn").textContent="ENTER";
  $("enterBtn").disabled=false;
}

$("knowBtn").onclick=()=>openDialog("known");
$("learnBtn").onclick=()=>openDialog("learn");
$("cancelBtn").onclick=closeDialog;
$("saveBtn").onclick=saveSubject;
$("subjectInput").addEventListener("keydown",e=>{if(e.key==="Enter")saveSubject()});
$("enterBtn").onclick=render;
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeDialog()});
$("moreBtn").onclick=handoffToChatGPT;
update();
})();
</script>
